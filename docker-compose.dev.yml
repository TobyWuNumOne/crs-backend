# Docker Compose for LOCAL DEVELOPMENT environment
# Uses port 5432 for database and 8000 for backend API
# Container names prefixed with 'crs-dev-' to avoid conflicts with test environment

services:
    db:
        container_name: crs-dev-db
        image: postgres:15
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-devuser}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
            POSTGRES_DB: ${POSTGRES_DB:-clinic_dev}
        ports:
            - '5432:5432'
        volumes:
            - crs_dev_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-devuser} -d ${POSTGRES_DB:-clinic_dev}',
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - crs-dev-network

    backend:
        container_name: crs-dev-backend
        build: .
        env_file:
            - .env
        environment:
            POSTGRES_SERVER: db
            POSTGRES_PORT: 5432
        ports:
            - '8000:8000'
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - .:/app
            - /app/__pycache__
        networks:
            - crs-dev-network

volumes:
    crs_dev_postgres_data:
        name: crs_dev_postgres_data

networks:
    crs-dev-network:
        name: crs-dev-network

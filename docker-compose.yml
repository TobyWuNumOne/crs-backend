version: '3.9'

services:
    db:
        container_name: crs-prod-db
        image: postgres:15
        restart: unless-stopped
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-prod_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_password}
            POSTGRES_DB: ${POSTGRES_DB:-clinic_prod}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-prod_user} -d ${POSTGRES_DB:-clinic_prod}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        container_name: crs-prod-backend
        build: .
        restart: unless-stopped
        env_file:
            - .env
        environment:
            POSTGRES_SERVER: db
            POSTGRES_PORT: 5432
            HOST: 0.0.0.0
            PORT: 8000
            WORKERS: ${WORKERS:-4}
            RELOAD: false
            API_PREFIX: ${API_PREFIX:-/api}
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WORKERS:-4}
        ports:
            - '8000:8000'
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - /app/__pycache__

volumes:
    postgres_data:
        name: postgres_data
